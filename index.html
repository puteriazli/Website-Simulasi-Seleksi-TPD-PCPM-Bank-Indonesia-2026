/* =========================================================
   SNAPSHOT BUILDERS — normalize a raw generated item into a
   shape that BOTH the live runner and the review recap can
   render identically via renderQuestionBody().
   ========================================================= */
function makeDigitSnapshot(item){
  const explanation = `Terjemahkan tiap ikon ke hurufnya sesuai kunci: ${item.seqLetters.map(l=>l).join('-')} → jawabannya adalah string <b>${item.correct}</b>. Cek posisi pertama dan terakhir dulu untuk mencoret opsi yang jelas salah, baru pastikan posisi tengahnya.`;
  const trick = `Jangan terjemahkan SEMUA ikon dulu baru cocokkan ke opsi. Cocokkan ikon PERTAMA saja ke semua opsi dulu (coret yang huruf pertamanya beda), lalu ikon TERAKHIR — biasanya sisa 1-2 opsi saja yang perlu dicek detail.`;
  return { type:'digit', seqIcons:item.seqIcons, key:item.key, options:item.options, correct:item.correct, len:item.len, explanation, trick };
}
function makeNumericalSnapshot(item){
  if(item.format==='series') return { type:'numerical', format:'series', shown:item.shown, options:item.options, correct:item.correct, explanation:item.explanation, trick:item.trick };
  if(item.format==='oddOneOut') return { type:'numerical', format:'oddOneOut', nums:item.nums, options:item.options, correct:item.correct, explanation:item.explanation, trick:item.trick };
  if(item.format==='analogy') return { type:'numerical', format:'analogy', a:item.a, b:item.b, c:item.c, options:item.options, correct:item.correct, explanation:item.explanation, trick:item.trick };
  return { type:'numerical', format:'grid', grid:item.grid, blankR:item.blankR, blankC:item.blankC, options:item.options, correct:item.correct, explanation:item.explanation, trick:item.trick };
}
function makeVerbalSnapshot(item){
  if(item.kind==='syllogism'){
    return { type:'verbal', format:'syllogism', premises:item.p, options:item.options, correct:item.correctIndex, explanation:item.explanation, trick:P.SYLLOGISM_TRICK };
  }
  if(item.kind==='assignment' || item.kind==='roundrobin'){
    return { type:'verbal', format:'longpuzzle', premises:item.narrative, questionText:item.questionText, options:item.options, correct:item.correct, explanation:item.explanation, trick:item.trick };
  }
  if(item.kind==='arrangement'){
    return { type:'verbal', format:'arrangement', premises:item.premises, questionText:item.questionText, options:item.options, correct:item.correct, explanation:item.explanation, trick:item.trick };
  }
  return { type:'verbal', format:'tfcs', passage:item.p, statement:item.s, options:['True','False','Cannot Say'], correct:item.a, explanation:P.verbalExplain(item), trick:P.VERBAL_TRICK };
}
function makeDiagramSnapshot(item){
  if(item.format==='sequence') return { type:'diagram', format:'sequence', shownSteps:item.shownSteps, options:item.options, correct:item.correct.key, explanation:item.explanation, trick:item.trick };
  if(item.format==='oddOneOut') return { type:'diagram', format:'oddOneOut', shapes:item.shapes, options:item.options, correct:item.correct, explanation:item.explanation, trick:item.trick };
  if(item.format==='matrix') return { type:'diagram', format:'matrix', grid:item.grid, blankR:item.blankR, blankC:item.blankC, options:item.options, correct:item.correct.key, explanation:item.explanation, trick:item.trick };
  if(item.format==='figure2x2') return { type:'diagram', format:'figure2x2', exX:item.exX, exY:item.exY, target:item.target, options:['X','Y','N'], correct:item.answer, explanation:item.explanation, trick:item.trick };
  return { type:'diagram', format:'classify', exX:item.exX, exY:item.exY, target:item.target, options:['X','Y','N'], correct:item.answer, explanation:item.explanation, trick:item.trick };
}
function makeSpatialSnapshot(item){
  return { type:'spatial', referenceShape:item.referenceShape, optionShapes:item.optionShapes, options:item.options, correct:item.correct, explanation:item.explanation, trick:item.trick };
}
function buildSnapshot(subtestKey, item){
  if(subtestKey==='digit') return makeDigitSnapshot(item);
  if(subtestKey==='numerical') return makeNumericalSnapshot(item);
  if(subtestKey==='verbal') return makeVerbalSnapshot(item);
  if(subtestKey==='diagram') return makeDiagramSnapshot(item);
  if(subtestKey==='spatial') return makeSpatialSnapshot(item);
}
function shortRepr(qs){
  if(qs.type==='digit') return 'Decode '+qs.len+' ikon → huruf';
  if(qs.type==='numerical'){
    if(qs.format==='series') return 'Deret: '+qs.shown.join(', ')+', ?';
    if(qs.format==='oddOneOut') return 'Cari angka ganjil: '+qs.nums.join(', ');
    if(qs.format==='analogy') return `Analogi: ${qs.a}:${qs.b} :: ${qs.c}:?`;
    return 'Tabel angka, sel baris '+(qs.blankR+1)+' kolom '+(qs.blankC+1);
  }
  if(qs.type==='verbal'){
    if(qs.format==='syllogism') return 'Silogisme: '+qs.premises.slice(0,60)+'…';
    if(qs.format==='longpuzzle') return qs.questionText;
    if(qs.format==='arrangement') return 'Susunan posisi: '+qs.questionText;
    return qs.statement;
  }
  if(qs.type==='diagram'){
    if(qs.format==='sequence') return 'Pola gambar berurutan (4 langkah)';
    if(qs.format==='oddOneOut') return 'Cari 1 bentuk yang menyimpang dari 5';
    if(qs.format==='matrix') return 'Matriks 3×3, lengkapi sel kosong';
    if(qs.format==='figure2x2') return 'Model X/Y — figur majemuk 2×2';
    return 'Bentuk '+qs.target.sides+' sisi, '+(qs.target.filled?'solid':'outline')+', '+qs.target.dots+' titik';
  }
  if(qs.type==='spatial') return 'Rotasi/cermin bentuk';
  return '';
}

/* =========================================================
   UNIFIED QUESTION RENDERER — same function drives both the
   timed runner (mode:'live') and the post-test recap (mode:'review').
   ========================================================= */
function makeOptionButton(label, value, correctValue, opts, extraClass){
  if(opts.mode==='live'){
    return el('button',{class:'opt-btn '+(extraClass||''), onclick:()=>opts.onSelect(value)},[label]);
  }
  let cls = 'opt-static '+(extraClass||'');
  if(value===correctValue) cls+=' chip-correct';
  if(opts.selected!=null && value===opts.selected && value!==correctValue) cls+=' chip-wrong';
  let suffix='';
  if(value===opts.selected && value===correctValue) suffix=' ✓';
  else if(value===opts.selected) suffix=' (jawabanmu)';
  else if(value===correctValue) suffix=' (kunci)';
  return el('div',{class:cls},[label+suffix]);
}
function buildKeyLegend(codes, key){
  const legend = el('div',{class:'digit-legend'});
  codes.forEach(c=>{
    const pair = el('div',{class:'digit-pair'},[ el('div',{class:'digit-num'},[String(c)]) ]);
    const symBox = el('div',{class:'digit-sym-box'});
    symBox.innerHTML = P.shapeSVG(key[c], 32);
    pair.appendChild(symBox);
    legend.appendChild(pair);
  });
  return legend;
}
// Shared renderer for "pick the option that is a shape" (used by diagram sequence & matrix)
function renderShapeOptionsRow(container, options, correctKey, opts, size){
  const row = el('div',{class:'option-row'});
  const LETTERS = 'ABCDEF';
  options.forEach((optShape,idx)=>{
    const val = optShape.key;
    let node;
    if(opts.mode==='live'){
      node = el('button',{class:'opt-btn opt-shape', onclick:()=>opts.onSelect(val)});
    } else {
      let cls='opt-static opt-shape';
      if(val===correctKey) cls+=' chip-correct';
      if(opts.selected!=null && val===opts.selected && val!==correctKey) cls+=' chip-wrong';
      node = el('div',{class:cls});
    }
    node.appendChild(el('div',{class:'opt-letter'},[LETTERS[idx]||String(idx+1)]));
    const svgWrap = el('div',{class:'opt-shape-svg'});
    svgWrap.innerHTML = P.shapeSVG(optShape, size||54);
    node.appendChild(svgWrap);
    if(opts.mode==='review'){
      let tag='';
      if(val===opts.selected && val===correctKey) tag='✓ jawabanmu & kunci';
      else if(val===opts.selected) tag='jawabanmu';
      else if(val===correctKey) tag='kunci';
      if(tag) node.appendChild(el('div',{class:'chip-tag'},[tag]));
    }
    row.appendChild(node);
  });
  container.appendChild(row);
}

function renderQuestionBody(container, snap, opts){
  if(snap.type==='digit') return renderDigitBody(container, snap, opts);
  if(snap.type==='numerical') return renderNumericalBody(container, snap, opts);
  if(snap.type==='verbal') return renderVerbalBody(container, snap, opts);
  if(snap.type==='diagram') return renderDiagramBody(container, snap, opts);
  if(snap.type==='spatial') return renderSpatialBody(container, snap, opts);
}

function shapeChip(shape, size){
  const box = el('span',{class:'inline-shape'});
  box.innerHTML = P.shapeSVG(shape, size||28);
  return box;
}

function pairListNode(pairs, opts, mode){
  // mode: 'count' shows a check/cross per pair (review only); 'odd' numbers each pair 1..n
  const list = el('div',{class:'pair-list'});
  pairs.forEach((p,idx)=>{
    const item = el('div',{class:'pair-item'},[(mode==='odd'?(idx+1)+'. ':'') + 'Kode '+p.c+' = ']);
    item.appendChild(shapeChip(p.shown, 26));
    if(opts.mode==='review'){
      if(mode==='count'){
        item.appendChild(el('span',{class:'pair-mark '+(p.isMatch?'mark-good':'mark-bad')},[p.isMatch?' ✓':' ✗']));

function parseTypedAnswer(raw, correctValue){
  const trimmed = (raw||'').trim();
  if(trimmed==='') return null;
  if(typeof correctValue === 'number'){
    const n = Number(trimmed);
    return Number.isNaN(n) ? null : n;
  }
  return trimmed.toUpperCase();
}
function makeTypedInputBlock(correctValue, opts, placeholder){
  const wrap = el('div',{class:'typed-answer-wrap'});
  const isNumeric = typeof correctValue === 'number';
  if(opts.mode==='live'){
    const input = el('input',{type:'text', inputmode: isNumeric?'numeric':'text', autocomplete:'off', class:'typed-input', placeholder: placeholder || (isNumeric?'Ketik angkanya...':'Ketik kodenya...')});
    const submit = ()=>{ opts.onSelect(parseTypedAnswer(input.value, correctValue)); };
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
    wrap.appendChild(input);
    wrap.appendChild(el('button',{class:'btn-primary typed-submit', onclick:submit},['Jawab →']));
    setTimeout(()=>{ try{ input.focus(); }catch(e){} }, 30);
  } else {
    const selected = opts.selected;
    const isCorrect = selected===correctValue;
    wrap.appendChild(el('div',{class:'typed-review-row'},[
      el('span',{class:'muted small'},['Jawabanmu: ']),
      el('span',{class:'typed-review-value '+(selected==null?'':(isCorrect?'text-correct':'text-wrong'))},[selected==null?'(kosong)':String(selected)])
    ]));
    if(!isCorrect){
      wrap.appendChild(el('div',{class:'typed-review-row'},[
        el('span',{class:'muted small'},['Kunci: ']),
        el('span',{class:'typed-review-value text-correct'},[String(correctValue)])
      ]));
    }
  }
  return wrap;
}

function renderNumericalBody(container, snap, opts){
  if(snap.format==='series'){
    container.appendChild(el('div',{class:'q-instr2 muted small'},['Lengkapi suku berikutnya dalam deret (ketik jawabannya):']));
    const row = el('div',{class:'series-row'});
    snap.shown.forEach(v=> row.appendChild(el('span',{class:'series-num'},[String(v)])));
    row.appendChild(el('span',{class:'series-num series-blank'},['?']));
    container.appendChild(row);
    container.appendChild(makeTypedInputBlock(snap.correct, opts));
    return;

  } else if(snap.format==='oddOneOut'){
    container.appendChild(el('div',{class:'q-instr2 muted small'},['Satu dari 5 angka berikut TIDAK mengikuti pola yang sama dengan 4 lainnya. Yang mana?']));
    const row = el('div',{class:'series-row'});
    snap.nums.forEach((n,idx)=> row.appendChild(el('span',{class:'series-num'},[(idx+1)+'. '+n])));
    container.appendChild(row);
    const optRow = el('div',{class:'option-row'});
    snap.options.forEach(v=> optRow.appendChild(makeOptionButton('Posisi '+v, v, snap.correct, opts, 'opt-btn-wide')));
    container.appendChild(optRow);
    return;

  } else if(snap.format==='analogy'){
    container.appendChild(el('div',{class:'q-instr2 muted small'},['Lengkapi analogi angka berikut (ketik jawabannya):']));
    container.appendChild(el('div',{class:'series-row'},[
      el('span',{class:'series-num'},[String(snap.a)]),
      el('span',{class:'analogy-sep'},[':']),
      el('span',{class:'series-num'},[String(snap.b)]),
      el('span',{class:'analogy-sep'},['::']),
      el('span',{class:'series-num'},[String(snap.c)]),
      el('span',{class:'analogy-sep'},[':']),
      el('span',{class:'series-num series-blank'},['?'])
    ]));
    container.appendChild(makeTypedInputBlock(snap.correct, opts));
    return;

  } else {
    container.appendChild(el('div',{class:'q-instr2 muted small'},['Lengkapi sel yang kosong (?) — ketik jawabannya:']));
    const table = el('table',{class:'num-grid'});
    snap.grid.forEach((rowArr,r)=>{
      const tr = el('tr',{});
      rowArr.forEach((val,c)=>{
        const isBlank = (r===snap.blankR && c===snap.blankC);
        tr.appendChild(el('td',{class:isBlank?'grid-blank':'grid-cell'},[isBlank?'?':String(val)]));
      });
      table.appendChild(tr);
    });
    container.appendChild(table);
    container.appendChild(makeTypedInputBlock(snap.correct, opts));
    return;
  }
}

    container.appendChild(el('p',{class:'verbal-passage arrangement-story'},[snap.premises]));
    container.appendChild(el('p',{class:'verbal-statement'},[snap.questionText]));
    const row = el('div',{class:'option-row'});
    snap.options.forEach(v=> row.appendChild(makeOptionButton(v, v, snap.correct, opts, 'opt-btn-wide')));
    container.appendChild(row);
    return;
  }
  container.appendChild(el('p',{class:'verbal-passage'},[snap.passage]));
  container.appendChild(el('p',{class:'verbal-statement'},['Pernyataan: “'+snap.statement+'”']));
  const row = el('div',{class:'option-row'});
  snap.options.forEach(v=> row.appendChild(makeOptionButton(v, v, snap.correct, opts, 'opt-btn-wide')));
  container.appendChild(row);
}

function renderDiagramBody(container, snap, opts){
  if(snap.format==='sequence'){
    container.appendChild(el('div',{class:'q-instr2 muted small'},['Lanjutkan pola gambar berikut:']));
    const seqRow = el('div',{class:'sequence-row'});
    snap.shownSteps.forEach(s=> seqRow.appendChild(el('div',{class:'shape-box', html:P.shapeSVG(s,60)})));
    seqRow.appendChild(el('div',{class:'shape-box shape-box-q'},['?']));
    container.appendChild(seqRow);
    renderShapeOptionsRow(container, snap.options, snap.correct, opts, 54);

  } else if(snap.format==='oddOneOut'){
    container.appendChild(el('div',{class:'q-instr2 muted small'},['Satu dari 5 bentuk berikut TIDAK memenuhi ciri yang sama dengan 4 lainnya. Yang mana?']));
    const row = el('div',{class:'sequence-row'});
    snap.shapes.forEach((s,idx)=>{
      const box = el('div',{class:'shape-box shape-numbered'});
      box.innerHTML = P.shapeSVG(s,54);
      box.appendChild(el('div',{class:'shape-index'},[String(idx+1)]));
      row.appendChild(box);
    });
    container.appendChild(row);
    const optRow = el('div',{class:'option-row'});
    snap.options.forEach(v=> optRow.appendChild(makeOptionButton('Posisi '+v, v, snap.correct, opts, 'opt-btn-wide')));
    container.appendChild(optRow);

  } else if(snap.format==='matrix'){
    container.appendChild(el('div',{class:'q-instr2 muted small'},['Lengkapi bentuk yang kosong pada matriks 3×3 berikut:']));
    const table = el('div',{class:'matrix-grid'});
    snap.grid.forEach((rowArr,r)=>{
      const rowEl = el('div',{class:'matrix-row'});
      rowArr.forEach((s,c)=>{
        const isBlank = (r===snap.blankR && c===snap.blankC);
        rowEl.appendChild(isBlank ? el('div',{class:'shape-box shape-box-q'},['?']) : el('div',{class:'shape-box', html:P.shapeSVG(s,50)}));
      });
      table.appendChild(rowEl);
    });
    container.appendChild(table);
    renderShapeOptionsRow(container, snap.options, snap.correct, opts, 48);

  } else if(snap.format==='figure2x2'){
    const legendWrap = el('div',{class:'diagram-legend'});
    const colX = el('div',{class:'diagram-col'},[el('div',{class:'diagram-col-label'},['Model X'])]);
    snap.exX.forEach(c=> colX.appendChild(el('div',{class:'shape-box', html:figure2x2SVG(c,54)})));
    const colY = el('div',{class:'diagram-col'},[el('div',{class:'diagram-col-label'},['Model Y'])]);
    snap.exY.forEach(c=> colY.appendChild(el('div',{class:'shape-box', html:figure2x2SVG(c,54)})));
    legendWrap.appendChild(colX); legendWrap.appendChild(colY);
    container.appendChild(legendWrap);
    container.appendChild(el('div',{class:'diagram-target'},[
      el('div',{class:'diagram-col-label'},['Bentuk ini termasuk?']),
      el('div',{class:'shape-box shape-box-lg', html:figure2x2SVG(snap.target,96)})
    ]));
    const row = el('div',{class:'option-row'});
    [['X','Model X'],['Y','Model Y'],['N','Bukan Keduanya']].forEach(([val,label])=>{
      row.appendChild(makeOptionButton(label, val, snap.correct, opts, 'opt-btn-wide'));
    });
    container.appendChild(row);

  } else {
    const legendWrap = el('div',{class:'diagram-legend'});
    const colX = el('div',{class:'diagram-col'},[el('div',{class:'diagram-col-label'},['Kelompok X'])]);
    snap.exX.forEach(s=> colX.appendChild(el('div',{class:'shape-box', html:P.shapeSVG(s,54)})));
    const colY = el('div',{class:'diagram-col'},[el('div',{class:'diagram-col-label'},['Kelompok Y'])]);
    snap.exY.forEach(s=> colY.appendChild(el('div',{class:'shape-box', html:P.shapeSVG(s,54)})));
    legendWrap.appendChild(colX); legendWrap.appendChild(colY);
    container.appendChild(legendWrap);
    container.appendChild(el('div',{class:'diagram-target'},[
      el('div',{class:'diagram-col-label'},['Bentuk ini termasuk?']),
      el('div',{class:'shape-box shape-box-lg', html:P.shapeSVG(snap.target,96)})
    ]));
    const row = el('div',{class:'option-row'});
    [['X','Kelompok X'],['Y','Kelompok Y'],['N','Bukan Keduanya']].forEach(([val,label])=>{
      row.appendChild(makeOptionButton(label, val, snap.correct, opts, 'opt-btn-wide'));
    });
    container.appendChild(row);
  }
}
function figure2x2SVG(cells, size){
  size = size||54; const half=size/2, gap=2;
  const cellSize = half-gap;
  const pos = [[0,0],[half,0],[0,half],[half,half]];
  let rects = cells.map((filled,i)=>{
    const [x,y]=pos[i];
    return `<rect x="${x+gap/2}" y="${y+gap/2}" width="${cellSize-gap/2}" height="${cellSize-gap/2}" fill="${filled?'var(--ink)':'none'}" stroke="var(--ink)" stroke-width="3"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${rects}</svg>`;
}
function renderSpatialBody(container, snap, opts){
  container.appendChild(el('div',{class:'q-instr2 muted small'},['Bentuk acuan (boleh diputar, TIDAK boleh dicerminkan):']));
  container.appendChild(el('div',{class:'diagram-target'},[
    el('div',{class:'shape-box shape-box-lg', html:P.spatialShapeSVG(snap.referenceShape,90)})
  ]));
  container.appendChild(el('div',{class:'q-instr2 muted small'},['Satu dari opsi berikut adalah hasil CERMINAN (bukan rotasi murni). Yang mana?']));
  const row = el('div',{class:'option-row'});
  snap.optionShapes.forEach((shape,idx)=>{
    const val = idx+1;
    let node;
    if(opts.mode==='live'){ node = el('button',{class:'opt-btn opt-shape', onclick:()=>opts.onSelect(val)}); }
    else {
      let cls='opt-static opt-shape';
      if(val===snap.correct) cls+=' chip-correct';
      if(opts.selected!=null && val===opts.selected && val!==snap.correct) cls+=' chip-wrong';
      node = el('div',{class:cls});
    }
    node.appendChild(el('div',{class:'opt-letter'},[String(idx+1)]));
    const svgWrap = el('div',{class:'opt-shape-svg'}); svgWrap.innerHTML = P.spatialShapeSVG(shape,56);
    node.appendChild(svgWrap);
    if(opts.mode==='review'){
      let tag='';
      if(val===opts.selected && val===snap.correct) tag='✓ jawabanmu & kunci';
      else if(val===opts.selected) tag='jawabanmu';
      else if(val===snap.correct) tag='kunci';
      if(tag) node.appendChild(el('div',{class:'chip-tag'},[tag]));
    }
    row.appendChild(node);
  });
  container.appendChild(row);
}

/* ---------------- TEST RUNNER ---------------- */
function buildQuestions(subtestKey, tierKey){
  if(subtestKey==='digit'){ const t = P.genDigitSymbolTest(tierKey); return t.items; }
  if(subtestKey==='numerical'){ const a=[]; for(let i=0;i<10;i++) a.push(P.genNumericalItem(tierKey)); return a; }
  if(subtestKey==='verbal'){ return P.genVerbalTest(tierKey); }
  if(subtestKey==='diagram'){ const a=[]; for(let i=0;i<10;i++) a.push(P.genDiagramItem(tierKey)); return a; }
  if(subtestKey==='spatial'){ const a=[]; for(let i=0;i<10;i++) a.push(P.genSpatialItem(tierKey)); return a; }
}


function startRun(subtestKey, tierKey){
  const st = P.SUBTESTS[subtestKey];
  RUN = {
    subtestKey, tierKey,
    items: buildQuestions(subtestKey, tierKey),
    index: 0,
    answers: [],
    timeLimitMs: st.minutes*60000,
    startTs: Date.now(),
    qShownTs: Date.now(),
    timerHandle: null,
    finished: false
  };
  RUN.answers = new Array(RUN.items.length).fill(null);
  renderRunner();
  RUN.timerHandle = setInterval(tick, 200);
}
function remainingMs(){ return Math.max(0, RUN.startTs + RUN.timeLimitMs - Date.now()); }
function tick(){
  if(!RUN || RUN.finished) return;
  const rem = remainingMs();
  const t = document.getElementById('run-timer');
  if(t){ t.textContent = fmtTime(rem); t.classList.toggle('timer-danger', rem<30000); }
  if(rem<=0) finishRun();
}
function answerCurrent(selected, qSnapshot){
  const timeMs = Date.now() - RUN.qShownTs;
  const correctFlag = selected === qSnapshot.correct;
  RUN.answers[RUN.index] = { selected, correctFlag, timeMs, qSnapshot, timedOut:false };
  RUN.index += 1;
  if(RUN.index >= RUN.items.length) finishRun();
  else { RUN.qShownTs = Date.now(); renderRunner(); }
}
function finishRun(){
  if(!RUN || RUN.finished) return;
  RUN.finished = true;
  clearInterval(RUN.timerHandle);
  for(let i=RUN.index;i<RUN.items.length;i++){
    if(!RUN.answers[i]) RUN.answers[i] = { selected:null, correctFlag:false, timeMs:null, qSnapshot: buildSnapshot(RUN.subtestKey, RUN.items[i]), timedOut:true };
  }
  renderResults();
}

function renderRunner(){
  root.innerHTML='';
  const st = P.SUBTESTS[RUN.subtestKey];
  root.appendChild(el('div',{class:'run-bar'},[
    el('div',{class:'run-bar-left'},[
      el('span',{class:'run-subtest'},[st.label]),
      el('span',{class:'run-tier badge'},[P.TIERS.find(t=>t.key===RUN.tierKey).label])
    ]),
    el('div',{class:'run-timer', id:'run-timer'},[fmtTime(remainingMs())])
  ]));
  const body = el('div',{class:'run-body card'});
  body.appendChild(el('div',{class:'q-instr muted small'},['Soal '+(RUN.index+1)+'/'+RUN.items.length]));
  root.appendChild(body);

  const q = RUN.items[RUN.index];
  const snap = buildSnapshot(RUN.subtestKey, q);
  renderQuestionBody(body, snap, { mode:'live', onSelect:(val)=>answerCurrent(val, snap) });

  root.appendChild(ledgerStrip());
}
function ledgerStrip(){
  const strip = el('div',{class:'ledger-strip'});
  RUN.items.forEach((q,i)=>{
    const state = i<RUN.index ? 'done' : (i===RUN.index ? 'current' : 'todo');
    strip.appendChild(el('span',{class:'lcell lcell-'+state},[String(i+1)]));
  });
  return strip;
}

/* ---------------- RESULTS ---------------- */
function renderResults(){
  root.innerHTML='';
  const st = P.SUBTESTS[RUN.subtestKey];
  const tier = P.TIERS.find(t=>t.key===RUN.tierKey);
  const total = RUN.answers.length;
  const correct = RUN.answers.filter(a=>a.correctFlag).length;
  const answeredTimes = RUN.answers.filter(a=>a.timeMs!=null).map(a=>a.timeMs);
  const totalTimeMs = answeredTimes.reduce((a,b)=>a+b,0);
  const avgTimeMs = answeredTimes.length? Math.round(totalTimeMs/answeredTimes.length) : 0;
  const acc = Math.round(100*correct/total);

  const beforeMastery = P.masteryOf(statsFor(RUN.subtestKey, RUN.tierKey));
  TRACK = P.recordAttempt(TRACK, RUN.subtestKey, RUN.tierKey, correct, total, totalTimeMs);
  const afterMastery = P.masteryOf(statsFor(RUN.subtestKey, RUN.tierKey));
  P.saveTrack(TRACK); // fire-and-forget, doesn't block rendering

  const head = el('section',{class:'results-head card'});
  head.appendChild(el('div',{class:'ticket-eyebrow'},[st.label.toUpperCase()+' · '+tier.label.toUpperCase()+' · HASIL SIMULASI']));
  head.appendChild(el('div',{class:'score-row'},[
    el('div',{class:'score-big'},[correct+' / '+total]),
    el('div',{class:'score-meta', html:
      '<div>Akurasi: <b>'+acc+'%</b></div>'+
      '<div>Waktu terpakai: <b>'+fmtTime(totalTimeMs)+'</b> dari '+fmtMinutes(st.minutes)+'</div>'+
      '<div>Rata-rata / soal: <b>'+fmtSec(avgTimeMs)+'</b></div>'
    })
  ]));
  head.appendChild(el('div',{class:'mastery-change'},
    beforeMastery.label!==afterMastery.label
      ? ['Status berubah: ', stampNode(beforeMastery), ' → ', stampNode(afterMastery)]
      : ['Status saat ini: ', stampNode(afterMastery)]
  ));
  head.appendChild(el('div',{class:'btn-row'},[
    el('button',{class:'btn-primary', onclick:()=>startInstructions(RUN.subtestKey, RUN.tierKey)},['Ulangi Level Ini']),
    el('button',{class:'btn-ghost', onclick: renderHome},['Kembali ke Dashboard'])
  ]));
  root.appendChild(head);

  const recap = el('section',{class:'recap card'});
  recap.appendChild(el('h3',{},['Buku Rekap — Soal, Jawabanmu & Pembahasan']));
  RUN.answers.forEach((a,i)=>{
    const qs = a.qSnapshot;
    const rowWrap = el('div',{class:'recap-item'});
    const top = el('div',{class:'recap-top', onclick:()=> rowWrap.classList.toggle('open')},[
      el('span',{class:'recap-no'},[String(i+1)]),
      el('span',{class:'recap-flag '+(a.correctFlag?'flag-good':'flag-bad')},[a.correctFlag?'BENAR':'SALAH']),
      el('span',{class:'recap-repr'},[shortRepr(qs)]),
      el('span',{class:'recap-time muted small'},[a.timeMs!=null? fmtSec(a.timeMs) : '—']),
      el('span',{class:'recap-caret'},['▾'])
    ]);
    const detail = el('div',{class:'recap-detail'});
    if(a.timedOut) detail.appendChild(el('div',{class:'trick-box small'},['Waktu habis sebelum soal ini sempat dijawab.']));
    renderQuestionBody(detail, qs, { mode:'review', selected:a.selected });
    detail.appendChild(el('div',{class:'recap-expl', html: qs.explanation||''}));
    if(qs.trick) detail.appendChild(el('div',{class:'trick-box small'},[el('b',{},['Trik cepat: ']), qs.trick]));
    rowWrap.appendChild(top); rowWrap.appendChild(detail);
    recap.appendChild(rowWrap);
  });
  root.appendChild(recap);
}

init();
})();

</script>
